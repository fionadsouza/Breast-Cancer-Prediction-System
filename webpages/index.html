<!DOCTYPE html>
<html>

<head>
    <title>Breast Cancer Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .card{
            background:white;
            width:900px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 40px rgba(0,0,0,0.25);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:gray;
            margin-bottom:25px;
        }

        .container{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:14px;
        }

        input:focus{
            border-color:#667eea;
            outline:none;
        }

        .buttons{
            text-align:center;
            margin-top:25px;
        }

        button{
            background:#667eea;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            margin:5px;
        }

        button:hover{
            background:#5563d6;
        }

        .reset-btn{
            background:#e74c3c;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:10px;
            cursor:pointer;
            margin:5px;
        }

        .reset-btn:hover{
            background:#c0392b;
        }

        .new-btn{
            background:#27ae60;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:10px;
            cursor:pointer;
            margin:5px;
        }

        .new-btn:hover{
            background:#1e8449;
        }

        .result{
            margin-top:25px;
            text-align:center;
            background:#f4f7ff;
            padding:20px;
            border-radius:10px;
        }

        .prediction{
            font-size:24px;
            font-weight:bold;
        }

        .confidence{
            margin-top:10px;
            font-size:18px;
            color:#555;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            color:gray;
        }

    </style>
</head>

<body>

<div class="card">

    <h1>🩺 Breast Cancer Prediction System</h1>

    <p class="subtitle">
        Logistic Regression Model | Accuracy: 97.37%
    </p>

    <form method="POST">

        <div class="container">

            <input type="number" step="any"
                   name="worst_texture"
                   placeholder="Worst Texture"
                   value="{{ form_data.get('worst_texture','') }}"
                   required>

            <input type="number" step="any"
                   name="radius_error"
                   placeholder="Radius Error"
                   value="{{ form_data.get('radius_error','') }}"
                   required>

            <input type="number" step="any"
                   name="worst_symmetry"
                   placeholder="Worst Symmetry"
                   value="{{ form_data.get('worst_symmetry','') }}"
                   required>

            <input type="number" step="any"
                   name="mean_concave_points"
                   placeholder="Mean Concave Points"
                   value="{{ form_data.get('mean_concave_points','') }}"
                   required>

            <input type="number" step="any"
                   name="worst_concavity"
                   placeholder="Worst Concavity"
                   value="{{ form_data.get('worst_concavity','') }}"
                   required>

            <input type="number" step="any"
                   name="area_error"
                   placeholder="Area Error"
                   value="{{ form_data.get('area_error','') }}"
                   required>

            <input type="number" step="any"
                   name="worst_radius"
                   placeholder="Worst Radius"
                   value="{{ form_data.get('worst_radius','') }}"
                   required>

            <input type="number" step="any"
                   name="worst_area"
                   placeholder="Worst Area"
                   value="{{ form_data.get('worst_area','') }}"
                   required>

            <input type="number" step="any"
                   name="mean_concavity"
                   placeholder="Mean Concavity"
                   value="{{ form_data.get('mean_concavity','') }}"
                   required>

            <input type="number" step="any"
                   name="worst_concave_points"
                   placeholder="Worst Concave Points"
                   value="{{ form_data.get('worst_concave_points','') }}"
                   required>

        </div>

        <div class="buttons">

            <button type="submit">
                Predict
            </button>

            <input type="reset"
                   value="Clear Fields"
                   class="reset-btn">

            <button type="button"
                    class="new-btn"
                    onclick="window.location.href='/'">
                New Prediction
            </button>

        </div>

    </form>

    {% if result %}
    <div class="result">

        <div class="prediction">
            {{ result }}
        </div>

        <div class="confidence">
            Confidence: {{ confidence }}%
        </div>

    </div>
    {% endif %}

    <div class="footer">
        Developed by Fiona Dsouza ❤️
    </div>

</div>

</body>
</html>
